name: Build RT Chat APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      MAX_UPLOAD_MB: ${{ vars.MAX_UPLOAD_MB || '25' }}
      ANDROID_COMPILE_SDK: '36'
      ANDROID_TARGET_SDK: '36'
      ANDROID_MIN_SDK: '23'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=""
          for v in SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Missing secrets:$missing - the APK will build but show a Setup needed screen."
          fi
          # Firebase secrets are optional (app uses local identity, not Google sign-in).

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle and Maven downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Restore signing keystore
        id: ks
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rtchat-debug-keystore-v1

      - name: Prepare signing keystore and print fingerprints
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Created a new signing keystore."
          fi
          FP=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:" | sed 's/^ *//')
          echo "$FP"
          {
            echo "### Signing fingerprints (add the SHA-1 to your Firebase Android app)"
            echo '```'
            echo "$FP"
            echo '```'
            echo "Package name: \`com.rtchat.rt_chat\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create Android scaffold (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.rtchat --project-name rt_chat --no-pub /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi
          mkdir -p android/app/src/main
          ls android

      - name: Patch Android project (label, permissions, SDK levels, desugaring)
        run: |
          python3 << 'PY'
          import os, re, pathlib, textwrap
          root = pathlib.Path("android")
          compile_sdk = os.environ.get("ANDROID_COMPILE_SDK", "36")
          target_sdk = os.environ.get("ANDROID_TARGET_SDK", "36")
          min_sdk = os.environ.get("ANDROID_MIN_SDK", "23")

          # Manifest: app name + permissions
          mf = root / "app/src/main/AndroidManifest.xml"
          s = mf.read_text()
          s = re.sub(r'android:label="[^"]*"', 'android:label="RT-Chat"', s, count=1)
          perms = [
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.READ_MEDIA_VIDEO",
              "android.permission.READ_MEDIA_AUDIO",
          ]
          add_p = "".join('    <uses-permission android:name="%s"/>\n' % p for p in perms if p not in s)
          s = s.replace("<application", add_p + "    <application", 1)
          mf.write_text(s)

          # App-level gradle (Kotlin DSL or Groovy)
          g = None
          for name in ("build.gradle.kts", "build.gradle"):
              cand = root / "app" / name
              if cand.exists():
                  g = cand
                  break
          if g is None:
              raise SystemExit("android/app/build.gradle(.kts) not found")
          kts = g.name.endswith(".kts")
          t = g.read_text()

          def force_sdk(text, prop, version_prop, value):
              if kts:
                  if re.search(rf"(?m)^\s*{prop}\s*=", text):
                      text = re.sub(rf"(?m)^(\s*){prop}\s*=\s*[^\n]+", rf"\1{prop} = {value}", text, count=1)
                  elif re.search(rf"(?m)^\s*{version_prop}\s*=", text):
                      text = re.sub(rf"(?m)^(\s*){version_prop}\s*=\s*[^\n]+", rf"\1{prop} = {value}", text, count=1)
                  else:
                      text = re.sub(r"(android\s*\{)", rf"\1\n    {prop} = {value}", text, count=1)
              else:
                  if re.search(rf"(?m)^\s*{version_prop}\s+", text):
                      text = re.sub(rf"(?m)^(\s*){version_prop}\s+[^\n]+", rf"\1{version_prop} {value}", text, count=1)
                  elif re.search(rf"(?m)^\s*{prop}\s+", text):
                      text = re.sub(rf"(?m)^(\s*){prop}\s+[^\n]+", rf"\1{prop} {value}", text, count=1)
                  else:
                      text = re.sub(r"(android\s*\{)", rf"\1\n    {version_prop} {value}", text, count=1)
              return text

          t = force_sdk(t, "compileSdk", "compileSdkVersion", compile_sdk)
          t = force_sdk(t, "targetSdk", "targetSdkVersion", target_sdk)
          t = force_sdk(t, "minSdk", "minSdkVersion", min_sdk)
          t = re.sub(r"flutter\.compileSdkVersion", compile_sdk, t)
          t = re.sub(r"flutter\.targetSdkVersion", target_sdk, t)
          t = re.sub(r"flutter\.minSdkVersion", min_sdk, t)

          if "coreLibraryDesugaring" not in t and "isCoreLibraryDesugaringEnabled" not in t:
              flag = "isCoreLibraryDesugaringEnabled = true" if kts else "coreLibraryDesugaringEnabled true"
              if re.search(r"compileOptions\s*\{", t):
                  t = re.sub(r"compileOptions\s*\{", lambda m: m.group(0) + "\n        " + flag, t, count=1)
              else:
                  if kts:
                      inject = (
                          "\n    compileOptions {\n        " + flag + "\n"
                          "        sourceCompatibility = JavaVersion.VERSION_17\n"
                          "        targetCompatibility = JavaVersion.VERSION_17\n    }\n"
                      )
                  else:
                      inject = (
                          "\n    compileOptions {\n        " + flag + "\n"
                          "        sourceCompatibility JavaVersion.VERSION_17\n"
                          "        targetCompatibility JavaVersion.VERSION_17\n    }\n"
                      )
                  t = re.sub(r"(android\s*\{)", r"\1" + inject, t, count=1)
              dep = (
                  'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
                  if kts
                  else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
              )
              if re.search(r"dependencies\s*\{", t):
                  t = re.sub(r"dependencies\s*\{", lambda m: m.group(0) + "\n    " + dep, t, count=1)
              else:
                  t += "\ndependencies {\n    " + dep + "\n}\n"

          g.write_text(t)
          print("Patched app gradle:", g)
          print("  compileSdk/targetSdk/minSdk ->", compile_sdk, target_sdk, min_sdk)

          # Force compileSdk on every Android subproject (file_picker, etc.)
          marker = "forceCompileSdkForPlugins"
          root_kts = root / "build.gradle.kts"
          root_groovy = root / "build.gradle"

          if root_kts.exists():
              rb = root_kts
              snippet = textwrap.dedent(
                  """
                  // forceCompileSdkForPlugins
                  subprojects {
                      fun Project.forceSdk() {
                          val ext = extensions.findByName("android") ?: return
                          try {
                              ext.javaClass.methods
                                  .find { it.name == "setCompileSdkVersion" && it.parameterCount == 1 }
                                  ?.invoke(ext, __SDK__)
                          } catch (_: Throwable) {}
                          try {
                              ext.javaClass.methods
                                  .find { it.name == "setCompileSdk" && it.parameterCount == 1 }
                                  ?.invoke(ext, __SDK__)
                          } catch (_: Throwable) {}
                      }
                      // Safe: afterEvaluate fails if the project is already evaluated
                      if (state.executed) {
                          forceSdk()
                      } else {
                          afterEvaluate { forceSdk() }
                      }
                  }
                  """
              ).replace("__SDK__", compile_sdk)
          else:
              rb = root_groovy
              snippet = textwrap.dedent(
                  """
                  // forceCompileSdkForPlugins
                  subprojects { subproject ->
                      def forceSdk = {
                          if (subproject.plugins.hasPlugin("com.android.library") ||
                              subproject.plugins.hasPlugin("com.android.application")) {
                              def androidExt = subproject.extensions.findByName("android")
                              if (androidExt != null) {
                                  try { androidExt.compileSdkVersion = __SDK__ } catch (Throwable ignored) {}
                                  try { androidExt.compileSdk = __SDK__ } catch (Throwable ignored) {}
                              }
                          }
                      }
                      if (subproject.state.executed) {
                          forceSdk()
                      } else {
                          subproject.afterEvaluate { forceSdk() }
                      }
                  }
                  """
              ).replace("__SDK__", compile_sdk)

          existing = rb.read_text() if rb.exists() else ""
          if marker not in existing:
              rb.write_text(existing.rstrip() + "\n" + snippet)
              print("Forced compileSdk on all subprojects via", rb)
          else:
              print("Subproject compileSdk force already present in", rb)

          (root / "app/proguard-rules.pro").write_text(
              "-keep class com.dexterous.** { *; }\n"
              "-keep class io.flutter.** { *; }\n"
              "-keep class com.google.gson.** { *; }\n"
              "-dontwarn com.google.android.play.core.**\n"
          )

          gp = root / "gradle.properties"
          extra_lines = [
              "org.gradle.caching=true",
              "org.gradle.parallel=true",
              "android.useAndroidX=true",
              "android.nonTransitiveRClass=true",
          ]
          existing = gp.read_text() if gp.exists() else ""
          for line in extra_lines:
              if line not in existing:
                  existing += "\n" + line
          gp.write_text(existing.rstrip() + "\n")

          print("--- app gradle SDK lines ---")
          for line in g.read_text().splitlines():
              if any(k in line for k in ("compileSdk", "targetSdk", "minSdk", "compileOptions", "desugar")):
                  print(line)
          # NOTE: Do not inject Groovy "android-plugin-fix" into build.gradle.kts
          # (Flutter uses Kotlin DSL; p.plugins.hasPlugin("...") fails to compile).
          # Subproject compileSdk is already forced above.

          print("Android project patched successfully.")
          PY

      - name: Generate app icon
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          cat > /tmp/make_icon.py << 'PYEOF'
          import os, sys
          from PIL import Image, ImageDraw

          S = 1024  # supersampled master size
          BG1, BG2 = (14, 128, 112), (9, 108, 93)   # teal green, matches the RT-Chat icon
          DOT = (11, 114, 100)

          def background(size):
              img = Image.new("RGB", (size, size))
              px = img.load()
              for y in range(size):
                  for x in range(size):
                      t = (x + y) / (2.0 * (size - 1))
                      px[x, y] = tuple(int(BG1[i] + (BG2[i] - BG1[i]) * t) for i in range(3))
              return img

          def bubble_shape(d, cx, cy, w, h, fill):
              d.ellipse([cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2], fill=fill)
              # tail, bottom-left
              tx = cx - w * 0.30
              ty = cy + h * 0.30
              d.polygon([(tx - w * 0.10, ty), (tx + w * 0.20, ty + h * 0.12), (tx - w * 0.16, ty + h * 0.50)], fill=fill)

          def glyph(size, scale):
              """Soft halo bubble + solid white bubble + three dots, centred, `scale` = halo width / canvas."""
              layer = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              halo = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              hw = size * scale
              hh = hw * 0.92
              cx, cy = size / 2, size / 2 - size * 0.02
              bubble_shape(ImageDraw.Draw(halo), cx, cy, hw, hh, (255, 255, 255, 90))
              layer.alpha_composite(halo)
              d = ImageDraw.Draw(layer)
              iw, ih = hw * 0.80, hh * 0.80
              bubble_shape(d, cx + hw * 0.02, cy + hh * 0.01, iw, ih, (255, 255, 255, 255))
              dr = iw * 0.055
              for k in (-1, 0, 1):
                  x = cx + hw * 0.02 + k * iw * 0.20
                  y = cy + hh * 0.01
                  d.ellipse([x - dr, y - dr, x + dr, y + dr], fill=DOT + (255,))
              return layer

          def main(res_dir):
              bg = background(S)
              full = bg.convert("RGBA")
              full.alpha_composite(glyph(S, 0.66))
              m = Image.new("L", (S, S), 0)
              ImageDraw.Draw(m).rounded_rectangle([0, 0, S - 1, S - 1], radius=int(S * 0.22), fill=255)
              full.putalpha(m)
              fg = glyph(S, 0.50)  # stays inside the adaptive-icon safe zone
              legacy = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
              adaptive = {"mdpi": 108, "hdpi": 162, "xhdpi": 216, "xxhdpi": 324, "xxxhdpi": 432}
              rnd = bg.convert("RGBA")
              rnd.alpha_composite(glyph(S, 0.62))
              cm = Image.new("L", (S, S), 0)
              ImageDraw.Draw(cm).ellipse([0, 0, S - 1, S - 1], fill=255)
              rnd.putalpha(cm)
              for dname, px in legacy.items():
                  out = os.path.join(res_dir, "mipmap-" + dname)
                  os.makedirs(out, exist_ok=True)
                  full.resize((px, px), Image.LANCZOS).save(os.path.join(out, "ic_launcher.png"))
                  rnd.resize((px, px), Image.LANCZOS).save(os.path.join(out, "ic_launcher_round.png"))
              for dname, px in adaptive.items():
                  out = os.path.join(res_dir, "mipmap-" + dname)
                  fg.resize((px, px), Image.LANCZOS).save(os.path.join(out, "ic_launcher_foreground.png"))
                  bg.resize((px, px), Image.LANCZOS).save(os.path.join(out, "ic_launcher_background.png"))
              any_dir = os.path.join(res_dir, "mipmap-anydpi-v26")
              os.makedirs(any_dir, exist_ok=True)
              xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                     '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                     '    <background android:drawable="@mipmap/ic_launcher_background"/>\n'
                     '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
                     '</adaptive-icon>\n')
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  open(os.path.join(any_dir, name), "w").write(xml)
              full.resize((512, 512), Image.LANCZOS).save(os.path.join(res_dir, "icon_preview_512.png"))
              print("Icon generated in", res_dir)

          if __name__ == "__main__":
              main(sys.argv[1])
          PYEOF
          python3 /tmp/make_icon.py android/app/src/main/res
          rm -f android/app/src/main/res/icon_preview_512.png
          # drop any stale default launcher icons that could shadow ours
          find android/app/src/main/res -name 'ic_launcher.webp' -delete || true

      - name: Get packages
        run: flutter pub get

      - name: Build release APK (retries on flaky downloads)
        run: |
          for i in 1 2 3; do
            if flutter build apk --release --target-platform android-arm,android-arm64 \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
              --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
              --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
              --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
              --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
              --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
              --dart-define=GIPHY_API_KEY="$GIPHY_API_KEY" \
              --dart-define=MAX_UPLOAD_MB="$MAX_UPLOAD_MB"; then
              break
            fi
            echo "Build attempt $i failed."
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep 20
          done

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk RT-Chat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RT-Chat-apk
          path: RT-Chat.apk
          retention-days: 30
