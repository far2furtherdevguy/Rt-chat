name: rt_chat
description: RT Chat - fast, private realtime chat.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Auth (Google account -> Firebase user id)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  # Chat backend: database, realtime, presence, file storage
  supabase_flutter: ^2.8.0
  # Local persistence + settings
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.3.2
  # Encryption
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  # Notifications (inline reply)
  flutter_local_notifications: ^17.2.3
  # Media
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  video_player: ^2.9.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  http: ^1.2.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
